# In-memory H2 — integratsion testlar uchun.
# PostgreSQL rejimi: "groups" kabi jadval nomlari production dagidek ishlaydi.
spring.datasource.url=jdbc:h2:mem:istudy;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.sql.init.mode=never

# Migratsiya runner testlarda avtomatik ishlamasin — testlar uni o'zi chaqiradi.
istudy.salary.backfill.enabled=false

jwt.secret=testSecretKeyForIntegrationTestsOnlyNotUsedInProduction
jwt.expiration=86400000
jwt.refresh.expiration=604800000

logging.level.root=WARN
logging.level.com.ogabek.istudy=INFO
